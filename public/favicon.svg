<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#shine)"/>
  <!-- Target/crosshair icon -->
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.9"/>
  <!-- Middle ring -->
  <circle cx="32" cy="32" r="11" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="4.5" fill="white" fill-opacity="0.95"/>
  <!-- Cross hairs -->
  <line x1="32" y1="10" x2="32" y2="20" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="54" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="20" y2="32" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="54" y2="32" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round"/>
</svg>
